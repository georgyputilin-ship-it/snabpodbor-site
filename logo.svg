<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Snabpodbor mark v6 (original): geometric lion profile in a magnifying lens. Two-layer mane, ear, brow, jaw. -->
  <line x1="46" y1="46" x2="60" y2="60" stroke="#1a2b6b" stroke-width="7" stroke-linecap="round"/>
  <circle cx="28" cy="28" r="25" fill="#1f5eff" stroke="#1a2b6b" stroke-width="4"/>
  <g transform="translate(6,5) scale(0.66)">
    <!-- outer mane -->
    <polygon fill="#9fb8ff" points="40,2 31,6 22,2 19,11 9,11 11,20 2,25 9,32 2,40 11,44 8,54 18,53 21,63 29,57 36,63 40,55 33,48 27,37 27,24 33,14 44,10"/>
    <!-- inner mane -->
    <polygon fill="#d9e4ff" points="50,9 40,8 31,13 26,22 25,34 28,43 34,50 40,55 42,49 35,44 31,35 31,24 37,16 46,13 52,16"/>
    <!-- head -->
    <polygon fill="#ffffff" points="44,10 36,16 31,24 31,35 35,44 42,49 47,46 49,40 57,40 62,35 61,28 55,25 52,16"/>
    <!-- brow -->
    <polygon fill="#1a2b6b" points="44,22 55,21 54,23 45,24"/>
    <!-- eye -->
    <polygon fill="#1f5eff" points="47,25 53,24.5 50,28"/>
    <!-- nose -->
    <polygon fill="#1a2b6b" points="58,29 62,29.5 61,34 57,32"/>
    <!-- mouth / jaw -->
    <polyline points="61,36 55,37 49,40" fill="none" stroke="#1a2b6b" stroke-width="1.6" stroke-linejoin="round"/>
    <polygon fill="#1a2b6b" points="49,40 56,40 52,43"/>
  </g>
</svg>
